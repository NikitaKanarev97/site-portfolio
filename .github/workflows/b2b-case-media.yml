name: B2B case curated media
on:
  push:
    branches:
      - portfolio/b2b-case-visual-v1
    paths:
      - .github/workflows/b2b-case-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Generate crops from source screenshots
        run: node scripts/build-b2b-case-visuals.mjs
      - name: Validate case source
        run: |
          npm run check
          npm run build
      - name: Commit localized WebP previews and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/media/rebuild/partner-portal/2026/*.webp
          git add -f public/media/rebuild/partner-portal/ru/2026/*.webp
          git add audit/b2b-case-refresh/crop-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(b2b-case): export localized optimized product evidence"
            git push origin HEAD:portfolio/b2b-case-visual-v1
          fi
